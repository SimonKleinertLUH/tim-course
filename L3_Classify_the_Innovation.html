<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classify the Innovation</title>
<style>
  :root{
    --blue:#00509B; --green:#C8D317; --lightblue:#CCDCEB; --midblue:#99B9D8;
    --grey:#666666; --lightgrey:#D9D9D9; --bg:#FFFFFF; --text:#1A1A1A;
    --ok:#2E7D32; --okbg:#E8F3E8; --no:#B3261E; --nobg:#FBEAEA;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;
    border-bottom:2px solid var(--blue);padding-bottom:8px;margin-bottom:14px}
  header .t{font-weight:bold;color:var(--blue);font-size:15px}
  header .s{font-size:14px;color:var(--grey)}
  .progress{height:6px;background:var(--lightgrey);border-radius:3px;overflow:hidden;margin-bottom:16px}
  .progress div{height:100%;background:var(--blue);width:0;transition:width .3s}
  h1{color:var(--blue);font-size:26px;margin:8px 0 10px}
  h2{color:var(--blue);font-size:21px;margin:4px 0 6px}
  p{line-height:1.45;font-size:16px;margin:8px 0}
  .muted{color:var(--grey);font-size:13px}
  .card{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start;margin-bottom:12px}
  .card img{width:100%;max-height:230px;object-fit:cover;border-radius:6px;border:1px solid var(--lightgrey)}
  .tag{display:inline-block;font-size:12px;color:var(--blue);border:1px solid var(--midblue);
    border-radius:12px;padding:2px 9px;margin-bottom:4px}
  .q{border-top:1px solid var(--lightgrey);padding-top:14px;margin-top:6px}
  .qnum{font-size:13px;color:var(--grey);margin-bottom:2px}
  .qtext{font-size:18px;font-weight:bold;margin:2px 0 4px}
  .persp{font-size:14px;color:var(--grey);margin-bottom:10px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button.opt{font:inherit;font-size:17px;padding:16px 10px;border-radius:8px;cursor:pointer;
    border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:bold;min-height:58px}
  button.opt:hover:not(:disabled){background:var(--lightblue)}
  button.opt:disabled{cursor:default}
  button.opt.correct{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
  button.opt.wrong{border-color:var(--no);background:var(--nobg);color:var(--no)}
  button.opt.faded{opacity:.45}
  .fb{margin-top:12px;padding:12px 14px;border-left:4px solid var(--blue);background:#F4F7FB;display:none}
  .fb.show{display:block}
  .fb .verdict{font-weight:bold;margin-bottom:4px}
  .fb .verdict.ok{color:var(--ok)} .fb .verdict.no{color:var(--no)}
  .fb .learn{font-size:15px;line-height:1.45}
  .nav{margin-top:16px;text-align:right}
  button.next{font:inherit;font-size:16px;font-weight:bold;padding:12px 22px;border-radius:8px;
    border:none;background:var(--blue);color:#fff;cursor:pointer}
  button.next:disabled{background:var(--lightgrey);color:var(--grey);cursor:default}
  table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
  th,td{border:1px solid var(--lightgrey);padding:7px 6px;text-align:left;vertical-align:top}
  th{background:var(--lightblue);color:var(--blue)}
  td.hit{background:var(--okbg)} td.miss{background:var(--nobg)}
  .score{font-size:40px;font-weight:bold;color:var(--blue);margin:4px 0}
  .key{margin-top:14px;padding:12px 14px;border-top:1px solid var(--lightgrey)}
  .key b{color:var(--blue)}
  .accent{display:inline-block;width:42px;height:4px;background:var(--green);margin:2px 0 10px}
  footer{margin-top:22px;font-size:11px;font-style:italic;color:#999}
  @media (max-width:600px){
    .card{grid-template-columns:1fr}
    .card img{max-height:200px}
    h1{font-size:23px}
    .opts{grid-template-columns:1fr}
    table{font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="t">Technology and Innovation Management</span><span class="s" id="scoreTop"></span></header>
  <div class="progress"><div id="bar"></div></div>
  <main id="app"></main>
  <footer>Inventions from TIME Best Inventions 2025; descriptions based on company information. Dimensions after Schilling (2023), Ch. 3.</footer>
</div>

  {key:"ce", label:"Competence-enhancing vs. competence-destroying", a:"Competence-enhancing", b:"Competence-destroying"},
  {key:"ac", label:"Architectural vs. component", a:"Architectural", b:"Component"}
];

const ITEMS = [
  {id:"philips", name:"Philips Norelco i9000 Prestige Ultra", cat:"Beauty",
   desc:"An electric shaver with new lift-and-cut blades, a sensor that adjusts motor power to beard density, and app-based coaching on shaving technique.",
   q:{
    pp:{persp:"From the perspective of Philips.", ans:"Product",
        learn:"Philips sells it as a new product. New blade production methods may also involve process innovation, but what reaches the customer is a better product."},
    ri:{persp:"Compared with earlier Philips shavers.", ans:"Incremental",
        learn:"It improves performance along a dimension customers already value (a closer shave). Think of 'the fifth blade in a razor'."},
    ce:{persp:"From the perspective of Philips.", ans:"Competence-enhancing",
        learn:"Competence-enhancing for Philips, which builds on decades of rotary-shaver know-how, but not necessarily for other companies (e.g., a blade-razor maker)."},
    ac:{persp:"Looking at the shaver as a system.", ans:"Component",
        learn:"Blades, sensor and software are improved; the basic design of a rotary shaver and how its parts fit together stays the same."}
   }},
  {id:"documine", name:"DataSnipper DocuMine", cat:"Artificial Intelligence",
   desc:"An AI assistant inside Excel that reads loan agreements, leases and other documents for auditors and links every answer back to the page it came from.",
   q:{
    pp:{persp:"From the perspective of an audit firm that uses it.", ans:"Process",
        learn:"For the audit firm it changes how the work is done, so it is a process innovation. For DataSnipper it is a product it sells. Same innovation, different category, depending on whose perspective you take."},
    ri:{persp:"Compared with how auditors already work with DataSnipper in Excel.", ans:"Incremental",
        learn:"The underlying technology (large language models) is new, but here it extends an existing tool and an existing workflow step by step."},
    ce:{persp:"From the perspective of a firm that sells manual document review to audit firms (e.g., an outsourced back office).", ans:"Competence-destroying",
        learn:"Its core skill, reading and extracting documents by hand, loses much of its value. For the audit firm itself the same tool is rather competence-enhancing: auditors still judge the evidence."},
    ac:{persp:"Looking at the audit workflow as a system.", ans:"Component",
        learn:"It replaces one step (manual document search) inside an unchanged audit process and an unchanged software environment (Excel)."}
   }},
  {id:"bluebird", name:"AST SpaceMobile BlueBird", cat:"Aerospace",
   desc:"Satellites that deliver 4G and 5G broadband directly to ordinary, unmodified smartphones. AST works with mobile network operators such as AT&T, Verizon and Vodafone.",
   q:{
    pp:{persp:"From the perspective of AST SpaceMobile.", ans:"Product",
        learn:"AST offers a new network service to operators. For the operators it changes how they deliver coverage, so for them it also has a process side."},
    ri:{persp:"Compared with existing mobile and satellite services.", ans:"Radical",
        learn:"Broadband from space straight to a standard phone is new to the world and carries high technical risk, even though the phone and the radio standard are familiar."},
    ce:{persp:"From the perspective of mobile network operators (e.g., Vodafone).", ans:"Competence-enhancing",
        learn:"Operators keep their customers, spectrum and know-how and extend their coverage. For providers of specialised satellite phones the same innovation is closer to competence-destroying."},
    ac:{persp:"Looking at the mobile network as a system.", ans:"Architectural",
        learn:"Phone, spectrum and radio standard stay the same; what changes is how they are linked: the cell tower now sits in orbit. Compare the Philips shaver, where improved parts sit in an unchanged design."}
   }}
];

const steps = [];
ITEMS.forEach((it,i)=>{ DIMS.forEach((d,j)=>steps.push({i,j})); });
let pos = -1, score = 0, answers = {};
const app = document.getElementById('app');
const bar = document.getElementById('bar');
const scoreTop = document.getElementById('scoreTop');

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function updateTop(){
  const done = Object.keys(answers).length;
  bar.style.width = (done/steps.length*100)+'%';
  scoreTop.textContent = pos>=0 ? `Score ${score} / ${done}` : '';
}

function start(){
  pos=-1; score=0; answers={};
  updateTop();
  app.innerHTML = `
    <h1>Classify the innovation</h1><div class="accent"></div>
    <p>Three inventions from TIME's Best Inventions of 2025. For each one, decide on the four dimensions:</p>
    <p><b>Product</b> or <b>process</b> · <b>radical</b> or <b>incremental</b> · <b>competence-enhancing</b> or <b>competence-destroying</b> · <b>architectural</b> or <b>component</b></p>
    <p>Read the perspective under each question carefully. After each answer you see the solution and a short explanation.</p>
    <div class="nav"><button class="next" onclick="next()">Start</button></div>`;
}

function next(){
  pos++;
  if(pos>=steps.length){ summary(); return; }
  render();
}

function render(){
  const {i,j} = steps[pos]; const it = ITEMS[i]; const d = DIMS[j]; const q = it.q[d.key];
  updateTop();
  app.innerHTML = `
    <div class="card">
      <img src="${IMG[it.id]}" alt="${esc(it.name)}">
      <div>
        <span class="tag">Invention ${i+1} of ${ITEMS.length} · ${esc(it.cat)}</span>
        <h2>${esc(it.name)}</h2>
        <p>${esc(it.desc)}</p>
      </div>
    </div>
    <div class="q">
      <div class="qnum">Question ${j+1} of 4 · ${esc(d.label)}</div>
      <div class="qtext">${esc(d.a)} or ${esc(d.b.toLowerCase())}?</div>
      <div class="persp">${esc(q.persp)}</div>
      <div class="opts">
        <button class="opt" data-v="${esc(d.a)}">${esc(d.a)}</button>
        <button class="opt" data-v="${esc(d.b)}">${esc(d.b)}</button>
      </div>
      <div class="fb" id="fb"></div>
      <div class="nav"><button class="next" id="nx" disabled onclick="next()">${pos===steps.length-1?'See results':'Next'}</button></div>
    </div>`;
  app.querySelectorAll('button.opt').forEach(b=>b.addEventListener('click',()=>choose(b,q)));
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(btn,q){
  const v = btn.dataset.v; const ok = v===q.ans;
  const {i,j} = steps[pos];
  answers[i+'-'+j] = {v, ok};
  if(ok) score++;
  app.querySelectorAll('button.opt').forEach(b=>{
    b.disabled = true;
    if(b.dataset.v===q.ans) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
    else b.classList.add('faded');
  });
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="verdict ${ok?'ok':'no'}">${ok?'Correct':'Not quite'}: ${esc(q.ans)}</div><div class="learn">${esc(q.learn)}</div>`;
  fb.classList.add('show');
  document.getElementById('nx').disabled = false;
  updateTop();
}

function summary(){
  updateTop();
  let rows = ITEMS.map((it,i)=>{
    const cells = DIMS.map((d,j)=>{
      const a = answers[i+'-'+j]; const cls = a&&a.ok?'hit':'miss';
      return `<td class="${cls}">${esc(it.q[d.key].ans)}</td>`;
    }).join('');
    return `<tr><td><b>${esc(it.name)}</b></td>${cells}</tr>`;
  }).join('');
  app.innerHTML = `
    <h1>Your result</h1><div class="accent"></div>
    <div class="score">${score} / ${steps.length}</div>
    <table>
      <tr><th>Invention</th><th>Product / process</th><th>Radical / incremental</th><th>Competence</th><th>Architectural / component</th></tr>
      ${rows}
    </table>
    <p class="muted">Green: you chose this answer. Red: you chose the other one.</p>
    <div class="key">
      <p><b>Look back at the explanations.</b> How often did the answer depend on whose perspective you took, or on what you compared the invention with?</p>
      <p>The same innovation can be a product for one firm and a process for another, competence-enhancing for one and competence-destroying for another, and radical in its technology but incremental in its use.</p>
    </div>
    <div class="nav"><button class="next" onclick="start()">Play again</button></div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

start();
</script>
</body>
</html>
